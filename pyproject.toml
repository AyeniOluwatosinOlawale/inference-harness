[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "inference-harness"
version = "0.1.0"
description = "Unified inference engineering harness — closed APIs + open models, benchmarking, profiling, web dashboard"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "inference", "benchmark", "profiling", "vllm", "sglang", "tensorrt"]
dependencies = [
    "anthropic>=0.116.0",
    "openai>=1.40.0",
    "google-generativeai>=0.8.0",
    "groq>=0.9.0",
    "httpx>=0.24.0",
    "pynvml>=11.5.0",
    "rich>=13.0.0",
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=12.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cuda = ["nvtx>=0.2.8"]

[project.scripts]
inference-harness = "inference_harness.__main__:app"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_harness"]

[tool.hatch.metadata]
allow-direct-references = true
